# cargo-deny policy: advisories, licenses, sources. Run by ci.yml.
[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.8
# Only what the dependency tree uses today; widen deliberately, in review.
allow = [
  "MIT",
  "Apache-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
